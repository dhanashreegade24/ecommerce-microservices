name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t dhanashreegade/productservice:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push dhanashreegade/productservice:${{ github.sha }}

      - name: Set Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig

      - name: Deploy to Kubernetes
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            NAMESPACE=dev
          else
            NAMESPACE=stage
          fi

          kubectl --kubeconfig=kubeconfig set image deployment/productservice \
          productservice=dhanashreegade/productservice:${{ github.sha }} -n $NAMESPACE